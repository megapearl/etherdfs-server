services:
  etherdfs:
    build: .
    container_name: ethersrv-linux
    # Critical: Use host networking to allow raw socket access (L2 frames)
    network_mode: host
    # Privilege required to open raw network sockets
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      # Map your host dataset where DOS games/files reside to /data
      - /mnt/storage/retro:/data
    # Replace 'vlan2' with your actual TrueNAS network interface if needed
    command: ethersrv-linux -f vlan2 /data
    restart: unless-stopped
