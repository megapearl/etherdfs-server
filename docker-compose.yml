services:
  etherdfs:
    build: .
    container_name: ethersrv-linux
    # Critical: Use host networking to allow raw socket access (L2 frames)
    network_mode: host
    # Privilege required to open raw network sockets
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      # Map your host dataset where DOS games/files reside to /data
      - /mnt/storage/retro:/data
    environment:
      # Replace 'vlan2' with your actual TrueNAS network interface (e.g., br0, enp3s0, bond0)
      - INTERFACE=vlan2
      # Optional: Set a custom volume label shown in DOS
      - VOLUME_LABEL=RETRO
      # Optional: Enable runtime debug logs without hex frame dumps (1 = true)
      - ETHERDFS_DEBUG=1
      # Optional: Inject artificial millisecond network delay to avoid host overrun (e.g., 5, 10, 25)
      - ETHERDFS_DELAY=0
    restart: unless-stopped
